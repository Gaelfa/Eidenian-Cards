<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title> Character Card </title>
 <link href="character_card.css" rel="stylesheet" media="all"/>
</head>

<body>
<main>

<article class="character-card">
<!-- top row split-->
  <header class="card-top-row">
<!-- portrait frame--> 
  <figure class="character-portrait-frame">
    <img src="character imgs/Iltheanneh Starfell.png" width="300" height="200">
  </figure>

  <!-- identity and traits column-->
  <section class="identity-traits"> 
    <h2 class="character-name"></h2>
  
    <aside class="traits-summary">
      <h3 class="block-label">Traits</h3>
      <ul class="traits-list">
        <li>
          <strong>Age:</strong>
        </li>
        <li>
          <strong>Species:</strong>
        </li>
        <li>
          <strong>Purpose:</strong>
        </li>
        <li>
          <strong>Origins:</strong>
        </li>
        <li>
          <strong>Current Location:</strong>
        </li> 
      </ul>
    </aside>
  </section>

  </header>

  <!-- mid section: magic profile banner-->
  <section class="magic-profile-banner">
    <strong class="magic-label">Magic:</strong>
    <p class="magic-val">...</p>
  </section>

  <footer class="card-bottom-row">
  
    <section clzss="biography-box">
      <h3>Brief Lore</h3>
      <p>...</p>            
    </section>
  
    <!--animal guide (right side bottom row)-->
    <section class="creature-guide-box">
      <h3>Creature spirit Guide</h3>
      <h4 class="creature-name">...</h4>
      <p class=" creature-bio">...</p>
    </section>
  
  </footer>
</article>
